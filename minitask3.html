<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Style Calculator</title>
    <link rel="stylesheet" href="minitask3.css" />
  </head>
  <body>
    <div class="calculator">
      <!-- Display -->
      <div class="display">
        <div class="result">0</div>
      </div>

      <!-- Buttons -->
      <div class="buttons">
        <!-- Row 1 -->
        <div class="deg-rad">
          <button>Deg</button>
          <span>|</span>
          <button>Rad</button>
        </div>
        <button class="sci">x!</button>
        <button class="operator">(</button>
        <button class="operator">)</button>
        <button class="operator">%</button>
        <button class="operator">AC</button>

        <!-- Row 2 -->
        <button class="sci">Inv</button>
        <button class="sci">sin</button>
        <button class="sci">ln</button>
        <button class="number">7</button>
        <button class="number">8</button>
        <button class="number">9</button>
        <button class="operator">÷</button>

        <!-- Row 3 -->
        <button class="sci">π</button>
        <button class="sci">cos</button>
        <button class="sci">log</button>
        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="operator">×</button>

        <!-- Row 4 -->
        <button class="sci">e</button>
        <button class="sci">tan</button>
        <button class="sci">√</button>
        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>
        <button class="operator">−</button>

        <!-- Row 5 -->
        <button class="sci">Ans</button>
        <button class="sci">EXP</button>
        <button class="sci">xʸ</button>
        <button class="number">0</button>
        <button class="number">.</button>
        <button class="equal">=</button>
        <button class="operator">+</button>
      </div>
    </div>
  </body>
</html>
